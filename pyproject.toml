[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-data-factory"
version = "0.3.0"
description = "Boutique human-data factory for finance & accounting LLM training datasets, with embedded internal controls and autonomous quality-control reviews."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.5",
    "anthropic>=0.40",
    "typer>=0.12",
    "httpx>=0.27",
    "stripe>=10",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
s3 = ["boto3>=1.34"]

[project.scripts]
hdf = "factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
